name: AdvancedCalculator
options:
  bundleIdPrefix: ru.itmo.maistrenko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  CalculatorEngine:
    path: CalculatorEngine

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  AdvancedCalculator:
    type: application
    platform: iOS
    sources:
      - path: AdvancedCalculator
        excludes:
          - Info.plist
    dependencies:
      - package: CalculatorEngine
    settings:
      base:
        INFOPLIST_FILE: AdvancedCalculator/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: ru.itmo.maistrenko.AdvancedCalculator
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  AdvancedCalculatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AdvancedCalculatorTests
    dependencies:
      - target: AdvancedCalculator
      - package: CalculatorEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.itmo.maistrenko.AdvancedCalculatorTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AdvancedCalculator:
    build:
      targets:
        AdvancedCalculator: all
        AdvancedCalculatorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AdvancedCalculatorTests
        - package: CalculatorEngine/CalculatorEngineTests
